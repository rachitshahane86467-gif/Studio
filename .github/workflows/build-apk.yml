
name: Build Studio Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: unzip Studio_Tracker_Android_Project.zip -d project

      - name: Build APK
        run: |
          cd project/Studio_Tracker_Android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Studio-Tracker-APK
          path: project/Studio_Tracker_Android/app/build/outputs/apk/debug/app-debug.apk
          
